version: 2

models:
  - name: dim_store
    description: Store dimension.
    columns:
      - name: store_key
        description: The surrogate key of the store.
        tests:
          - unique
          - not_null

      - name: businessentityid
        description: The natural key of the store.
        tests:
          - not_null
          - unique

      - name: storename
        description: The name of the store.

      - name: salespersonid
        description: The salesperson associated with the store.